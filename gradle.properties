org.gradle.jvmargs=-Xmx4G
org.gradle.caching=true
# JDT LS resolves annotationProcessor across projects without their Gradle 9 locks.
# Keep imports serial until eclipse-jdtls/eclipse.jdt.ls#3807 is fixed; CLI may opt in with --parallel.
org.gradle.parallel=false

# Mod properties
modVersion=0.1.0
mavenGroup=dev.tapetum
archivesBaseName=tapetum-shaders

# Shared toolchain. Fabric Loader is a build-time/runtime dependency, shared across every version.
# Loom is a Gradle *plugin*, pinned per version module instead (in each module's own build.gradle.kts
# plugins {} block) - Loom releases aren't uniformly compatible with every Minecraft version this
# project targets, so a single shared pin here can't work once more than one Loom version is needed.
fabricLoaderVersion=0.19.3

# Per-Minecraft-version targets. Each gets its own module and its own jar; see README.
# 1.21.11 is the last release before the 26.x calendar renumbering (26.1 "Tiny Takeover" picks up
# where 1.21.11 left off) - the nearest neighbour below 26.1.2, and the first step of the walk back
# towards 1.16.5. See README's "Roadmap towards 1.16.5" for the versions still to come.
mc12111_minecraft=1.21.11
mc12111_fabricApi=0.141.3+1.21.11
mc12111_sodium=0.8.7+mc1.21.11

mc261_minecraft=26.1.2
mc261_fabricApi=0.154.2+26.1.2

mc262_minecraft=26.2
mc262_fabricApi=0.158.0+26.2
mc263_minecraft=26.3
mc263_fabricApi=0.161.0+26.3
org.gradle.daemon=false
