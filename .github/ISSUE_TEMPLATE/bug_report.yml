name: Bug report
description: Report a reproducible Tapetum issue
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Check https://github.com/Tapetum-mods/Tapetum/issues for duplicates.
        Rendering is experimental. Include the exact Minecraft and Tapetum versions.
  - type: input
    id: minecraft
    attributes:
      label: Minecraft version
      placeholder: '26.1.2'
    validations:
      required: true
  - type: input
    id: tapetum
    attributes:
      label: Tapetum version or commit
      placeholder: '0.1.0-snapshot+mc26.1.2-build.42'
    validations:
      required: true
  - type: input
    id: shaderpack
    attributes:
      label: Shaderpack name and version
  - type: textarea
    id: reproduction
    attributes:
      label: Steps, expected result and actual result
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, GPU, driver and Java version
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Attach latest.log and relevant screenshots. Remove private information before uploading.
