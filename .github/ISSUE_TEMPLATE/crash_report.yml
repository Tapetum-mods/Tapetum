name: Crash report
description: Report a reproducible Tapetum crash
labels: [bug]
body:
  - type: input
    id: minecraft
    attributes:
      label: Minecraft version
      placeholder: '26.1.2'
    validations:
      required: true
  - type: input
    id: tapetum
    attributes:
      label: Tapetum version or commit
      placeholder: '0.1.0-snapshot+mc26.1.2-local'
    validations:
      required: true
  - type: input
    id: shaderpack
    attributes:
      label: Shaderpack name and version
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, GPU, driver and Java version
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Crash report and latest.log
      description: Attach both files and list other mods. Remove private information before uploading.
    validations:
      required: true
